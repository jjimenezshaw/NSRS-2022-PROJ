<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPCS2022</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        body {
            padding: 0;
            margin: 0;
        }

        html,
        body,
        #map {
            height: 100%;
            width: 100%;
        }

        .more-data {
            max-height: 250px;
            overflow-y: auto;
            font-size: 0.9em;
        }

        path.leaflet-interactive:focus {
            outline: none;
        }

        .attrname {
            color: dimgray;
        }

        .leaflet-tooltip {
            background-color: DarkSlateGray;
            border-color: DarkSlateGray;
            color: white;
            border-radius: 1px;
            padding: 3px;
        }

        .color-box {
            width: 10px;
            height: 10px;
            opacity: 0.6;
            display: inline-block;
        }

        .div-in-textbox {
            padding: 5px;
            border: none;
            background-color: white;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script>

        async function loadMapGeoJSON(url) {
            let response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Error loading geoJson for ${url}`);
            } else {
                return await response.json();
            }
        }

        L.Control.Textbox = L.Control.extend({
            options: {
                position: 'topright',
                innerHTML: 'There should be something'
            },
            onAdd: function (map) {
                var container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
                var div = L.DomUtil.create('div', 'div-in-textbox', container);
                div.innerHTML = this.options.innerHTML;
                return container;
            }
        });

        const map = L.map('map').setView([35, -100], 3);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>,' +
                ' <a href="https://beta.ngs.noaa.gov/SPCS/">NOAA/NGS</a>',
        }).addTo(map);

        const layers = {
            'Special Use': { file: 'special_use.geojson', color: 'dimgray', z: 5 },
            'Special Use - Gulf': { file: 'special_use_gulf.geojson', color: 'blue', z: 4 },
            'Multizone Partial': { file: 'multizone_partial.geojson', color: 'green', z: 3 },
            'Multizone Complete': { file: 'multizone_complete.geojson', color: 'salmon', z: 2 },
            'Statewide': { file: 'statewide.geojson', color: 'orange', z: 1, load: true },
        }

        const control = L.control.layers(null, null, { collapsed: false }).addTo(map);

        const radiosTxt = 'Show on click:<br> \
                      <input type="radio" id="props" name="r" value="props" checked /><label for="props">Properties</label> \
                      <input type="radio" id="facts" name="r" value="facts" /><label for="facts">Distortion factors</label>';

        const radios = new L.Control.Textbox({ position: 'topright', innerHTML: radiosTxt });
        radios.addTo(map);

        function loadScript(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.async = true;
                script.onload = () => {
                    resolve(`Successfully loaded: ${url}`);
                };
                script.onerror = () => {
                    reject(new Error(`Failed to load script at: ${url}`));
                };
                document.head.appendChild(script);
            });
        }

        let proj = null;
        async function load_proj() {
            try {
                // Promise.all triggers both downloads simultaneously
                await Promise.all([
                    loadScript('https://jjimenezshaw.github.io/wasm-proj/proj/wasm/projModule.js'),
                    loadScript('https://jjimenezshaw.github.io/wasm-proj/proj/projFunctions.js')
                ]);

                console.log("Both scripts are loaded and ready!");
                proj = new Proj();
                await proj.init();
                console.log(`proj loaded`, proj.proj_info())
                return proj;
            } catch (error) {
                console.error("One of the scripts failed to load:", error);
            }
        }

        function create_crs(p) {
            let str = ''
            if (p.ProjAbrv == "OMC") {
                str += `+proj=omerc 
                    +lat_0=${p.Lat0_deg} +lonc=${p.Lon0_W_deg} 
                    +alpha=${p.SkewAz_deg} +gamma=${p.SkewAz_deg}`;
            } else if (p.ProjAbrv == "LC1") {
                str += `+proj=lcc +lat_1=${p.Lat0_deg} +lat_0=${p.Lat0_deg} +lon_0=${p.Lon0_W_deg}`
            } else if (p.ProjAbrv == "TM") {
                str += `+proj=tmerc +lat_0=${p.Lat0_deg} +lon_0=${p.Lon0_W_deg}`
            }
            str += ` +k_0=${p.ProjScale} +x_0=${p.FalseE_m} +y_0=${p.FalseN_m} +ellps=GRS80 +type=crs`;
            return str;
        }
        async function get_elevation(latlon) {
            const settings = {
                method: 'POST',
                body: JSON.stringify([[latlon.lat, latlon.lng]]),
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                }
            };
            try {
                const fetchResponse = await fetch(`https://elevation.racemap.com/api`, settings);
                const data = await fetchResponse.json();
                return data[0];
            } catch (e) {
                throw e;
            }
        }
        async function compute_factors(latlon, properties) {
            if (!proj) {
                await load_proj()
            }
            crs = create_crs(properties);
            const elev = await get_elevation(latlon);
            console.log(elev);
            const factors = await proj.factors({ crs: crs, points: [[latlon.lat, latlon.lng, elev]] });
            console.log(factors)
            const f = factors[0];
            let r = `Point: ${latlon.lat.toFixed(4)}, ${latlon.lng.toFixed(4)}, ${elev}<br>`
            const ff = (p) => `${p.toFixed(6)} (${((p - 1) * 1e6).toFixed(2)} ppm)`
            r += 'Distortion factors:<br>';
            r += `Projection: ${ff(f.meridional_scale)}<br>`;
            r += `Elevation: ${ff(f.elevation_factor)}<br>`;
            r += `Combined: ${ff(f.combined_factor)}`;
            return r;
        }

        async function load() {
            for (const name in layers) {
                const metadata = layers[name];
                const geojson = await loadMapGeoJSON(metadata.file);

                map.createPane(name).style.zIndex = 400 + metadata.z;

                const layer = L.geoJSON(geojson, {
                    pane: name,
                    style: function (feature) {
                        return { color: metadata.color, weight: 1 };
                    },
                    onEachFeature: function (feature, layer) {
                        layer.on('click', async function (e) {
                            const prop = feature.properties;
                            if (document.getElementById('facts').checked) {
                                layer.bindPopup(`<strong>${prop.AbrvFull}</strong>`).openPopup(e.latlng);
                                const factors = await compute_factors(e.latlng, feature.properties);
                                const html = `<strong>${prop.AbrvFull}</strong><br>${factors}`;
                                layer.setPopupContent(html);
                            } else {
                                let html = `${prop.AbrvFull}<br>${prop.NameFull}`;
                                html += '<details>< summary >Details</summary ><div class="more-data">';
                                for (const k in prop) {
                                    if (k != 'fid' && prop[k] !== null && prop[k] !== -9999)
                                        html += `<span class="attrname">${k}:</span> ${prop[k]}<br>`;
                                }
                                html += '</div></details > ';
                                layer.bindPopup(html, { minWidth: 180 }).openPopup(e.latlng);
                            }
                        });

                    }
                }).bindTooltip(function (layer) {
                    return layer.feature.properties.AbrvFull;
                }, { direction: 'center', opacity: 0.8 }
                );
                if (metadata.load) layer.addTo(map);
                const name_with_box = `<span class="color-box" style="background-color: ${metadata.color};"></span> ${name}`;
                control.addOverlay(layer, name_with_box)
            }
        }
        window.addEventListener('load', load);
    </script>
</body>

</html>
