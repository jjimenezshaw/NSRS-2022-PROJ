<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPCS2022</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        body {
            padding: 0;
            margin: 0;
        }

        html,
        body,
        #map {
            height: 100%;
            width: 100%;
        }

        .more-data {
            max-height: 250px;
            overflow-y: auto;
            font-size: 0.9em;
        }

        path.leaflet-interactive:focus {
            outline: none;
        }

        .attrname {
            color: dimgray;
        }

        .leaflet-tooltip {
            background-color: DarkSlateGray;
            border-color: DarkSlateGray;
            color: white;
            border-radius: 1px;
            padding: 3px;
        }

        .color-box {
            width: 10px;
            height: 10px;
            opacity: 0.6;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script>

        async function loadMapGeoJSON(url) {
            let response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Error loading geoJson for ${url}`);
            } else {
                return await response.json();
            }
        }

        const map = L.map('map').setView([35, -100], 3);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>,' +
                ' <a href="https://beta.ngs.noaa.gov/SPCS/">NOAA/NGS</a>',
        }).addTo(map);

        const layers = {
            'Special Use': { file: 'simplified_special_use.geojson', color: 'dimgray', z: 5 },
            'Special Use - Gulf': { file: 'simplified_special_use_gulf.geojson', color: 'blue', z: 4 },
            'Multizone Partial': { file: 'simplified_partial.geojson', color: 'green', z: 3 },
            'Multizone Complete': { file: 'simplified_complete.geojson', color: 'salmon', z: 2 },
            'Statewide': { file: 'simplified_statewide.geojson', color: 'orange', z: 1, load: true },
        }

        const control = L.control.layers(null, null, { collapsed: false }).addTo(map);

        async function load() {
            for (const name in layers) {
                const metadata = layers[name];
                const geojson = await loadMapGeoJSON(metadata.file);

                map.createPane(name).style.zIndex = 400 + metadata.z;

                const layer = L.geoJSON(geojson, {
                    pane: name,
                    style: function (feature) {
                        return { color: metadata.color, weight: 1 };
                    }
                }).bindTooltip(function (layer) {
                    return layer.feature.properties.AbrvFull;
                }, { direction: 'center', opacity: 0.8 }
                ).bindPopup(function (layer) {
                    const prop = layer.feature.properties;
                    let html = `${prop.AbrvFull}<br>${prop.NameFull}`;
                    html += '<details> <summary>Details</summary><div class="more-data">';
                    for (const k in prop) {
                        if (k != 'fid' && prop[k] !== null && prop[k] !== -9999)
                            html += `<span class="attrname">${k}:</span> ${prop[k]}<br>`;
                    }
                    html += '</div></details>';
                    return html;
                }, { minWidth: 180 });
                if (metadata.load) layer.addTo(map);
                const name_with_box = `${name} <span class="color-box" style="background-color: ${metadata.color};"></span>`;
                control.addOverlay(layer, name_with_box)
            }
        }
        window.addEventListener('load', load);
    </script>
</body>

</html>
